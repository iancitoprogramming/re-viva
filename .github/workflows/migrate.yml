name: Prisma Migrate Deploy

on:
  push:
    branches:
      - main

jobs:
  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug secrets
        run: |
          [ -z "$DATABASE_URL" ] && echo "::error::DATABASE_URL is EMPTY" || echo "DATABASE_URL is SET"
          [ -z "$DIRECT_URL" ] && echo "::error::DIRECT_URL is EMPTY" || echo "DIRECT_URL is SET"

      - name: Create .env
        run: printf 'DATABASE_URL=%s\nDIRECT_URL=%s\n' "$DATABASE_URL" "$DIRECT_URL" > .env

      - name: Run migrations
        run: npx prisma migrate deploy
